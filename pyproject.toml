[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallwidgy-auto-wallpaper"
version = "2.0.0"
description = "A tray-first, reliable Wallwidgy wallpaper changer for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Asif Ahamed", email = "asifahamedstudent@gmail.com" }]
dependencies = [
  "requests>=2.32.4,<3",
  "Pillow>=11.3,<13",
  "PySide6-Essentials>=6.9,<7",
  "comtypes>=1.4.11,<2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "PyInstaller>=6.15,<7",
]

[project.scripts]
wallwidgy-wallpaper = "wallpaper_changer.app:main"

[project.gui-scripts]
wallwidgy-wallpaper-gui = "wallpaper_changer.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wallpaper_changer = ["assets/*.svg", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
pythonpath = ["src"]
markers = ["live: uses the live Wallwidgy service"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
